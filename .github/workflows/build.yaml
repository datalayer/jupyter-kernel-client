name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  # Called by release.yaml on the tagged commit: a tag whose tests fail publishes nothing.
  workflow_call:

defaults:
  run:
    shell: bash -eux {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only: the job runs on ubuntu-latest, so naming macOS and Windows here
        # only labelled Ubuntu runs with their names.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install the extension
        run: |
          python -m pip install ".[test]"

      - name: Test the extension
        run: |
          pytest jupyter_kernel_client/tests/ --timeout=300 --cov=jupyter_kernel_client --cov-report term-missing

      - name: Build the extension
        run: |
          pip install build
          python -m build --sdist
          cp dist/*.tar.gz my_server_extension.tar.gz
          pip uninstall -y "jupyter_kernel_client"
          rm -rf "jupyter_kernel_client"

      - uses: actions/upload-artifact@v5
        if: startsWith(matrix.os, 'ubuntu')
        with:
          name: my_server_extension-sdist-${{ matrix.python-version }}
          path: my_server_extension.tar.gz

  check_links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1

  test_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - name: Run Linters
        run: |
          bash ./.github/workflows/lint.sh

  test_sdist:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: "x64"
      - uses: actions/download-artifact@v6
        with:
          name: my_server_extension-sdist-${{ matrix.python-version }}
      - name: Install and Test
        run: |
          pip install my_server_extension.tar.gz
          pip list 2>&1 | grep -ie "jupyter_kernel_client"
          python -c "import jupyter_kernel_client"
